<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>浏览器采集</title>
<style>body{font:14px system-ui;width:310px;padding:16px;color:#17212f}button{padding:9px 14px;cursor:pointer;margin:8px 5px 0 0}p{line-height:1.6}#status{white-space:pre-wrap}</style>
<h3>采集当前官网</h3><p>在正常可访问的器械目录页或产品页启动。将依次打开同站产品页，打包公开页面与图片。最多 50 页，每台器械取列表 1 张及详情最多 3 张图片。</p>
<button id="start">开始采集</button><button id="stop">停止并导出已采集内容</button>
